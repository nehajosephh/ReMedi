
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacist Sign In | ReMedi</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/pharmacy.css') }}">
</head>
<body>

    <div class="login-page">

        <!-- Header -->
        <header class="login-header">
            <a href="/" class="back-button" aria-label="Go back">
                &#8249;
            </a>

            <span class="brand">ReMedi</span>

            <span class="staff-badge">Pharmacy staff</span>
        </header>

        <!-- Main content -->
        <main class="login-content">

            <h1>Pharmacist sign in</h1>

            <p class="subtitle">
                We check your registration before you can see any
                patient orders.
            </p>

            <form method="POST"
                  action="{{ url_for('pharmacy.login') }}">

                <div class="form-group">
                    <label for="psi">
                        PSI registration number
                    </label>

                    <input
                        type="text"
                        id="psi"
                        name="psi"
                        placeholder="e.g. 12345"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="pharmacy">
                        Pharmacy
                    </label>

                    <select id="pharmacy" name="pharmacy" required>
                        <option value="drumcondra">
                            [PHARMACY NAME], Drumcondra
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your password"
                        required
                    >
                </div>

                <button type="submit" class="sign-in-button">
                    Verify and sign in
                </button>

            </form>

            <!-- Information notice -->
            <div class="verification-notice">
                <span class="shield-icon">♢</span>

                <p>
                    Your number is checked against the PSI register
                    and must match the pharmacy you choose.
                </p>
            </div>

        </main>

        <!-- Footer -->
        <footer class="login-footer">
            Not a pharmacist?
            <a href="/">Go back</a>
        </footer>

    </div>

</body>
</html>
