<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pharmacist Sign In | ReMedi</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/pharmacy.css') }}">

    <style>
        .remedi-login {
            max-width: 390px;
            min-height: 100vh;
            margin: auto;
            padding: 28px 22px;
            background: #f6faf7;
            color: #20352a;
        }

        .login-brand {
            color: #2e805b;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 55px;
        }

        .remedi-login h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .login-description {
            color: #63746a;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .remedi-login label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin: 20px 0 8px;
        }

        .remedi-login input,
        .remedi-login select {
            width: 100%;
            padding: 15px;
            border: 1px solid #c9ded0;
            border-radius: 12px;
            background: white;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            background: #2e805b;
            color: white;
            border: 0;
            border-radius: 28px;
            padding: 16px;
            font-weight: 700;
            margin-top: 28px;
            cursor: pointer;
        }

        .demo-notice {
            margin-top: 20px;
            padding: 16px;
            border: 1px solid #d7e7dc;
            background: white;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.6;
        }

        .login-error {
            color: #9c3030;
            margin-top: 14px;
        }
    </style>
</head>

<body style="margin:0; background:#eaf0eb;">

<main class="remedi-login">

    <div class="login-brand">✚ ReMedi</div>

    <h1>Pharmacist sign in</h1>

    <p class="login-description">
        Access your pharmacy's patients, orders and
        prescription renewal requests.
    </p>

    {% if error %}
        <p class="login-error">{{ error }}</p>
    {% endif %}

    <form method="POST"
          action="{{ url_for('pharmacy.login') }}">

        <label for="psi_number">PSI registration number</label>
        <input
            id="psi_number"
            name="psi_number"
            placeholder="Enter demo PSI number"
            required
        >

        <label for="pharmacy_id">Pharmacy</label>

        <select id="pharmacy_id"
                name="pharmacy_id"
                required>

            <option value="">Select your pharmacy</option>

            {% for pharmacy in pharmacies %}
                <option value="{{ pharmacy.id }}">
                    {{ pharmacy.name }} · {{ pharmacy.address }}
                </option>
            {% endfor %}

        </select>

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            name="password"
            placeholder="Demo password"
            required
        >

        <button class="login-button" type="submit">
            Sign in
        </button>

    </form>

    <div class="demo-notice">
        <strong>HackUCD demo access</strong>
        <p>
            This uses fictional pharmacist records.
            Live PSI registration verification is not enabled.
        </p>
    </div>

</main>

</body>
</html>
