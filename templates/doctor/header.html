<header class="topbar">
  <div class="topbar-left">
    <svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><path d="M11 3h8v8h8v8h-8v8h-8v-8H3v-8h8z" fill="currentColor"/></svg>
    <span class="wordmark">ReMedi</span>
    <span class="practice">{{ doctor.practice }}</span>
  </div>
  <nav class="tabs" aria-label="GP sections">
    <a href="{{ url_for('doctor.home') }}" class="tab {% if active == 'requests' %}tab-active{% endif %}" {% if active == 'requests' %}aria-current="page"{% endif %}>Renewal requests</a>
    <a href="{{ url_for('doctor.patients') }}" class="tab {% if active == 'patients' %}tab-active{% endif %}" {% if active == 'patients' %}aria-current="page"{% endif %}>My patients</a>
  </nav>
  <div class="topbar-right">
    <span class="badge badge-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
      Medical Council verified
    </span>
    <span>{{ doctor.name }}</span>
    <a href="{{ url_for('logout') }}" class="topbar-link">Sign out</a>
  </div>
</header>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="page page-messages">
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
